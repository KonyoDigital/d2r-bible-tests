name: 📺 TV DIABLO — agent tests
on:
  push:
    paths: ['tv/**']
  workflow_dispatch:
jobs:
  agent-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Run the agent TDD suite (stdlib only — no deps, no vision cost)
        run: python3 tv/test_agent.py
      - name: Run the control suite (lazy webview imports — headless-safe)
        run: python3 tv/test_control.py
      - name: Roundtrip acceptance (ON AIR → seal → SIM, stub mode)
        run: python3 tv/test_roundtrip_sim.py
      - name: Intake wiring smoke (node runner executes the real intake.js, no model call)
        run: |
          echo '{"path":"/api/intake","body":{"ping":1}}' | node tv/intake_local.mjs | grep -q '"missing image"' && echo "intake runner OK"
