name: 📺 TV DIABLO — agent tests
on:
  push:
    paths: ['tv/**']
  workflow_dispatch:
jobs:
  agent-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Run the agent TDD suite (stdlib only — no deps, no vision cost)
        run: python3 tv/test_agent.py
      - name: Run the control suite (lazy webview imports — headless-safe)
        run: python3 tv/test_control.py
      - name: Roundtrip acceptance (ON AIR → seal → SIM, stub mode)
        run: python3 tv/test_roundtrip_sim.py
      - name: Frozen-robot boot smoke (TV_ROBOT=1 lane must not rot — 20s stub, no model call)
        run: python3 tv/robot_smoke.py
      # Pillow is installed ON PURPOSE: without it the RED/GREEN class skips, and a guard that
      # skips is a guard that reports OK while measuring nothing. The reel fixture is generated,
      # so no footage of his is ever committed.
      - name: Install Pillow (so the chronicle RED/GREEN actually runs instead of skipping)
        run: python3 -m pip install --quiet pillow
      - name: Chronicle known-frame wire (retro sweep must receive the live agent's marks — 0 → 8)
        run: python3 tv/test_chronicle_known_wire.py
      - name: Intake wiring smoke (node runner executes the real intake.js, no model call)
        run: |
          # body arrives as an escaped JSON string ({"status":400,"body":"{\"error\":\"missing image\"}"}) — grep escape-proof
          echo '{"path":"/api/intake","body":{"ping":1}}' | node tv/intake_local.mjs | grep -q 'missing image' && echo "intake runner OK"
