name: 📺 TV DIABLO — agent tests
on:
  push:
    # ⚠ IT MUST WATCH ITSELF. `TestEveryRoutineCanSeeTheInputItPolices` in tv/test_control.py
    # already makes this a law for the five routine workflows — "a gate that cannot see the
    # input it polices is not a gate" — and this file was never in that list, so every edit to
    # the verdict machinery below changed what CI DOES while triggering nothing. Block style,
    # one quoted string per line, because that is the shape that gate's own parser reads.
    paths:
      - 'tv/**'
      - '.github/workflows/tv-tests.yml'
  workflow_dispatch:
jobs:
  agent-suite:
    runs-on: ubuntu-latest
    # ⚠⚠ v3472 (#184) — SHARDED, NOT RAISED. The whole gate set ran 25m18s against the 25-minute
    # ceiling on d9bdb682 and was CANCELLED: the shipped version got no verdict at all. This job's
    # own watchdog already says it — "The fix is to shard the gate set, never to raise the ceiling"
    # — so each shard runs a deterministic, cost-balanced HALF (tv/run_gates.py --shard K/N) inside
    # the same 25 minutes. ⚠ N lives in TWO places — the list below and GATE_SHARDS in the verdict
    # job — and test_a_cut_off_gate_set_is_not_a_verdict goes red if they ever disagree.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    # ⚠ 25, NOT 20 — RAISED WITH THE CHROMIUM STEPS BELOW, because the pair of them is what
    # reproduces v1810 otherwise. MEASURED: the agent-suite job runs 7m18s (08:53:32 -> 09:00:50 on
    # be704dc7). The two new steps are bounded at 6 + 5 = 11, so a double stall would reach ~18.3
    # against a 20-minute cap — under it, with no margin for the gate set growing by one suite.
    # And the failure mode is the one that hides: hitting the JOB cap surfaces in `gh run list` as
    # **cancelled**, which reads as "a person cancelled this" rather than "something stalled".
    # 25 matches publish.yml, which learned this the same way.
    timeout-minutes: 25
    # ⚠⚠ v3472 — NO JOB `outputs:` ANY MORE, ON PURPOSE. A matrix job's outputs keep only the LAST
    # shard to finish, so a red shard 1 overwritten by a green shard 2 would read as a PASS. Each
    # shard publishes its gate-set fact as an ARTIFACT instead, and the verdict job reads EVERY shard.
    env:
      # ⚠ ONE COPY OF THE CEILING, AT JOB SCOPE, AND IT MUST EQUAL `timeout-minutes` ABOVE.
      # Two steps below quote this number in what they print. A step-local copy was the first
      # shape of this and it left the cancelled-path step falling back to a hardcoded 25 that
      # nothing checked — a right number under a label that had stopped being driven by it.
      # tv/test_a_cut_off_gate_set_is_not_a_verdict.py goes red if these two ever drift.
      CEILING_MINUTES: 25
    steps:
      # The ceiling below is a number in YAML; this is the only way anything in the run can
      # tell how much of it was actually spent. Written before checkout so it covers the whole
      # job, not just the part after the clone.
      - name: Mark the job start (the ceiling is measured from here, never assumed)
        run: echo "JOB_STARTED_AT=$(date -u +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          # v2679 — DEEP ENOUGH FOR THE SHIP-HISTORY GATE, AND NO DEEPER.
          #
          # `actions/checkout` clones with depth=1. `tv/test_tasks_ships_are_recorded.py` reads
          # `git log -200` to check that recent ships are recorded in TASKS.md, so on a shallow
          # checkout it correctly DECLARES A SKIP rather than reporting a false pass — and my own
          # census then flagged it, verbatim:
          #
          #   ⛔ 2 GATE(S) PASSED WHILE COVERING NOTHING ON THIS VENUE:
          #      test_chronicle_template (12 of 12), test_tasks_ships_are_recorded
          #
          # That was right, and it made the gate almost worthless: `run_gates.py` is NOT in the
          # pre-push blocking set either (hooks/pre-push:353), so the only place it ran for real
          # was a by-hand full clone. A guard that covers nothing on every venue that matters is
          # the same defect as one that never runs.
          #
          # 200 is the gate's own window, not a round number — deeper costs clone time on every
          # run for history nothing reads. If that window ever widens, this must widen with it.
          fetch-depth: 200
      # Pillow FIRST: without it the chronicle RED/GREEN class skips, and a guard that skips
      # reports OK while measuring nothing. The reel fixture is generated, so none of his footage
      # is ever committed.
      #
      # ⚠⚠ websocket-client IS NOT OPTIONAL, AND ITS ABSENCE FAILED A GATE THAT LOOKS UNRELATED TO
      # SOCKETS. tv/render_check.py:1955-1965 guards main() with `import websocket` and returns 2
      # on ImportError. test_render_coverage's TheRatchetIsActuallyJOINEDToTheVerdict stubs
      # _chrome_up/_chrome_down/COVERAGE/check but NOT that import, so on the runner main() bailed
      # at line 1965 before any coverage logic ran and
      # `test_a_coverage_refusal_is_not_counted_as_a_render_failure` never saw the string it
      # asserts on. Its sibling test only asserts rc != 0, and rc=2 satisfies that — which is why
      # exactly 1 of the 2 failed and the cause read as a coverage bug rather than a missing
      # package. REPRODUCED locally by putting a `websocket.py` that raises on PYTHONPATH: with it
      # the file goes FAILED (failures=2) matching CI byte for byte, without it failures=1.
      # The message it printed on the runner was never visible in the log: run_gates.py:2096 is
      # `print("   " + ln[:200])` and the assertion line is 301 chars, so the tail carrying
      # "the websocket client is not installed" was truncated away. FOUR SHIPS red.
      # ⚠ WHAT ELSE THIS TOUCHES, stated rather than assumed. render_check.py is NOT a registered
      # gate in run_gates.py, so nothing new drives Chrome from there — main() simply reaches its
      # own logic instead of the import guard. The one other reader is test_control.py:131, where
      # the same import is deliberately optional and its absence returns None. That helper is a
      # LAST-RESORT fallback: it runs only if `loopback_path() == "cdp"` or after BOTH --headless
      # --dump-dom modes failed to answer (test_control.py:242-275). On a runner --dump-dom answers,
      # so the usual path is unchanged; if it ever does not, a case that used to SKIP now gets a
      # real reading, which is the direction this repo wants. Its three callers still guard on
      # find_browser() and browser_can_load_localhost(), so no browser is assumed into existence.
      # Same interpreter as the gate set (`python3 -m pip`), so there is no env split.
      # v2881 — numpy joins them: without it vault_corpus.inventory_lattice refuses every frame
      # with "unreadable: No module named 'numpy'" before any lattice fit is attempted, so the
      # lattice laws graded an import error rather than the refusal wording they were written for.
      - name: Install Pillow + numpy + websocket-client (a missing import is a skip wearing a failure)
        run: python3 -m pip install --quiet pillow numpy websocket-client
      # ⚠⚠ THIS WORKFLOW HAD NO BROWSER AT ALL, AND ONE GATE MEASURES PIXELS.
      # `overlap_ratchet` catches the class `render_check` cannot see — two labels drawn on top of
      # each other, both fully on screen, neither clipped. With no Chromium here it could only ever
      # answer "headless chrome would not start", so v2658 taught it to exit 77 and DECLARE that as
      # a venue skip rather than fail the build. That was honest and it was not a fix: d2r-bible §8
      # is explicit that a gate which always skips is the same defect as one that never runs, and
      # this one then measured on his Mac ONLY — the machine we are forbidden to run suites on.
      #
      # ⚠ IT MUST LAND WITH THE CACHE, NOT WITHOUT IT. v1810's publish sat in `playwright install`
      # for 25 MINUTES, hit the job's timeout cap, and surfaced in `gh run list` as **cancelled** —
      # which reads as "a person cancelled this", not "a download stalled", and the site silently
      # stayed a version behind. Same pattern as publish.yml:97-117, and the same reasoning: the
      # cache means the usual run downloads nothing, and the step's OWN timeout (well under the
      # job's 20) makes a stall fail THE STEP with its name on it.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: pw-${{ runner.os }}-
      # SPLIT from the deps below, because the two halves fail for different reasons and only one
      # matters. On publish.yml the 8-minute bound proved it was never the browser download — it
      # was `--with-deps` running apt against a mirror that answered `Ign` for eight straight
      # minutes. Bundling them lets a broken Ubuntu mirror block a gate that has nothing to do
      # with apt.
      - name: Install Chromium
        timeout-minutes: 6
        run: npx playwright install chromium
      # Best effort: ubuntu-latest already carries the shared libs Chromium needs, so this is a
      # top-up and not a prerequisite. If it stalls we continue — and if the libs really are
      # missing, `overlap_ratchet` fails on a browser launch, which names the problem far better
      # than an apt timeout does. ⚠ And it still cannot go silently green: the gate exits 77 with
      # a DECLARED reason when Chrome will not start, so an absent browser reads as a loud skip
      # rather than a pass.
      - name: OS deps for Chromium (best effort)
        timeout-minutes: 5
        continue-on-error: true
        run: npx playwright install-deps chromium
      # ONE GATE SET, ONE VERDICT.
      #
      # This step used to hand-list SEVEN suites while tv/run_gates.py knew about TWENTY-SIX, so
      # nineteen gates only ever ran when a human typed the command — js-syntax, visual-lock,
      # test_routes, test_reachability, ui_icons, the whole chronicle family, the vault laws, the
      # G5 lane and more. All nineteen were measured GREEN when this was written, so nothing was
      # hiding; the defect was structural, not a red.
      #
      # That is the exact decay run_gates.py was BUILT to stop. Its own docstring: "'The gate set'
      # was a thing people carried in their heads and typed by hand, which means it was different
      # for every person and every session, and a suite could fall out of it silently" — after
      # tv/test_routes.py exited 1 for about a hundred versions and nobody knew (REG-079). The list
      # moved into a file, TestNoOrphanSuite started failing on any unlisted tv/test_*.py — and then
      # CI quietly kept its own shorter copy, which is the same defect one level up.
      #
      # run_gates.py reports a SKIP loudly and only exits non-zero on a real failure, so a gate that
      # genuinely cannot run degrades honestly instead of failing the job.
      #
      # v1711 — THE TWO GATES THAT USED THAT MERCY AS A HIDING PLACE NOW RUN. Both were written to
      # skip when their environment was missing, and both then skipped ~always, so 2 of the 27 were
      # decoration:
      #   · js-syntax needed a browser answering --dump-dom over http://127.0.0.1. Chrome never does
      #     on Konyo's Mac (measured v1490), so it skipped for ~220 versions. It now PARSES every
      #     inline <script> with `node --check` — no browser, no loopback, no server.
      #   · test_button_matrix hardcoded :17772 and told the operator to start the console by hand,
      #     so its coverage depended on whether he happened to have the app open. It now boots its
      #     OWN control_app on a free ephemeral port via TV_CONTROL_PORT and stops it after.
      #     ⚠ It must never bind or kill :17772 — that is his LIVE console.
      # Both were proven RED before being trusted green (a gate nobody has seen fail is measuring
      # nothing), and both still report SKIP rather than a pass if their lane truly cannot come up.
      # ⚠ v2691 — BOSS PORTRAITS HAD NO CI BACKUP AT ALL. `art/verify_boss_portraits.py` was
      # invoked from exactly ONE place in the repo: hooks/pre-push. Measured by grepping every
      # workflow — zero hits. So it only ever fired on a local push through an intact hook, and a
      # `--no-verify` push, or a push from a clone where core.hooksPath was never set, shipped the
      # art unchecked. It is pure stdlib and cheap, so there is no reason for it to live on one
      # machine's goodwill. A gate with a single fragile venue is a gate you find out about later.
      - name: Boss portraits are the pictures a human opened, and the board serves them
        run: python3 art/verify_boss_portraits.py

      # ⚠ THE LABEL SAID "all 30" AND THE FILE HOLDS 144. That number was written when the set had
      # 30 gates and was never touched again — the same stale-count drift TASKS.md's own audit
      # found ("the 30-gate set ... is ~4.7x stale"). A step name is read far more often than the
      # file it runs, so it is worth keeping true. Measured on run 33991499070 (v2690): the step
      # printed "140 gate(s) passed, 4 skipped for a DECLARED reason" = 144, matching the static
      # Gate(...) count exactly. No allowlist here: whatever is registered runs.
      # ⚠ IT RECORDS HOW LONG IT NEEDED, AND A RUN THAT NEVER FINISHES RECORDS NOTHING.
      # MEASURED on six consecutive runs (gh api .../jobs, 2026-09-23), gate-set step only:
      #   35817826235 15m46s · 35820756987 17m25s · 35842043863 19m35s
      #   35834810032 23m04s · 35815188806 23m13s · 35823272442 23m37s
      #   35825866589 CUT OFF at 24m23s — its true length is UNKNOWN, not 24m23s.
      # Setup before this step measured 48-64s, so the worst COMPLETED run used 24m41s of the
      # 25-minute ceiling: a margin of 19 seconds. `GATE_SET_SECONDS` is written AFTER the
      # verdict, so if this step is cut off the variable is ABSENT rather than zero, and the
      # watchdog below reports UNKNOWN instead of a reassuring 0.
      - name: THE GATE SET (tv/run_gates.py — every registered gate, one verdict)
        id: gateset
        run: |
          _t0=$(date -u +%s)
          set +e
          python3 tv/run_gates.py --shard ${{ matrix.shard }}/2
          _rc=$?
          set -e
          echo "GATE_SET_SECONDS=$(( $(date -u +%s) - _t0 ))" >> "$GITHUB_ENV"
          # ⚠⚠ v3447 — THE VERDICT JOB MUST NOT INFER "THE GATES WERE RED" FROM `result == failure`.
          # Found by the cross-family eye on the SHIPPED v3446 bytes, which it read at 122,996 chars.
          # A job is `failure` when ANY step fails, and two paths reach that WITHOUT a red gate set:
          #   (1) `Install Chromium` has timeout-minutes: 6 and NO continue-on-error. If it fails,
          #       THIS STEP NEVER RUNS, GATE_SET_SECONDS is never written, the always() watchdog
          #       reports NO VERDICT and exits 1 — so the job is `failure` and the verdict job
          #       announced GATES RED about a gate set that never started. One run emitting both
          #       "NO VERDICT" and "GATES RED" is the exact UNKNOWN-vs-measured conflation this
          #       whole workflow was written to end.
          #   (2) the gate set exits 0 and a LATER step (the intake smoke) fails — same false red.
          # So the fact "the gate set reached a verdict" is published HERE, by the only step that
          # can know it, instead of being guessed downstream from a job-level word.
          # ⚠⚠ v3452 — EXIT 2 IS *NO GATE RAN*, NOT *A GATE WAS RED*. run_gates.main() returns
          #   0  every registered gate passed
          #   1  a gate was RED — a real verdict
          #   2  _claim_the_tree() found the tree already locked, so NOTHING was run
          # Folding 2 into `red=true` publishes a verdict nobody reached: the lock refusal means
          # the gate set never graded anything. Three states, and UNKNOWN is one of them.
          # [[unknown-stays-unknown]]
          if [ "$_rc" -eq 2 ]; then
            _reached=false; _red=unknown
          else
            _reached=true
            if [ "$_rc" -eq 0 ]; then _red=false; else _red=true; fi
          fi
          echo "reached=$_reached" >> "$GITHUB_OUTPUT"
          echo "red=$_red" >> "$GITHUB_OUTPUT"
          # v3472 — the same fact, as a file this shard publishes (see the artifact step below)
          mkdir -p gate-verdict
          printf 'reached=%s\nred=%s\n' "$_reached" "$_red" > "gate-verdict/shard-${{ matrix.shard }}.txt"
          exit $_rc
      - name: Publish this shard's gate-set fact (the verdict reads EVERY shard, not the last)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: gate-verdict-${{ matrix.shard }}
          path: gate-verdict/
          if-no-files-found: ignore
          retention-days: 3

      - name: Intake wiring smoke (node runner executes the real intake.js, no model call)
        run: |
          # body arrives as an escaped JSON string ({"status":400,"body":"{\"error\":\"missing image\"}"}) — grep escape-proof
          echo '{"path":"/api/intake","body":{"ping":1}}' | node tv/intake_local.mjs | grep -q 'missing image' && echo "intake runner OK"

      # ⚠⚠ HOW MUCH CEILING WAS LEFT — because "it passed" and "it barely got there" look identical.
      #
      # Board #184, measured: the worst COMPLETED run spent 24m41s of a 25m ceiling. Nineteen
      # seconds. Whether Konyo gets a verdict at all is decided by runner noise, and nothing in the
      # log said so — you had to go and diff step timestamps out of `gh api` to find it.
      #
      # ⚠ IT IS A WARNING, NOT A FAILURE, AND THAT IS DELIBERATE. Three of the six measured runs sit
      # inside the margin; a row that turns them all red is a row that gets silenced within a week,
      # which costs more than the defect. "At the ceiling" gets its OWN STATE, separate from the
      # "no verdict" error below it.
      #
      # ⚠ AND AN ABSENT DURATION IS UNKNOWN, NEVER ZERO. `GATE_SET_SECONDS` is written by the gate
      # set AFTER its verdict, so a cut-off run leaves it unset — and an unset shell variable in
      # arithmetic is 0, which would read here as "the gate set took no time and the margin is
      # enormous", the most reassuring possible lie.
      - name: How much of the ceiling was left (a thin margin is the next silent run)
        if: always()
        run: |
          _ceiling=$(( CEILING_MINUTES * 60 ))
          if [ -z "${GATE_SET_SECONDS:-}" ] || [ -z "${JOB_STARTED_AT:-}" ]; then
            echo "::error title=NO VERDICT::the gate set never reached the end of its own step, so how long it needed is UNKNOWN - not zero, and not fine. This run checked nothing."
            exit 1
          fi
          _used=$(( $(date -u +%s) - JOB_STARTED_AT ))
          _left=$(( _ceiling - _used ))
          echo "ceiling ${_ceiling}s - used ${_used}s (gate set ${GATE_SET_SECONDS}s of it) = ${_left}s left"
          if [ "$_left" -lt 300 ]; then
            echo "::warning title=AT THE CEILING::only ${_left}s of the ${_ceiling}s job ceiling was left. This suite is one runner hiccup away from being cut off, and a cut-off job reports as 'cancelled', not red. The fix is to shard the gate set, never to raise the ceiling."
          fi

      # ⚠⚠ THE ONE THAT MATTERS: A CUT-OFF JOB MUST SAY SO ON ITS WAY DOWN.
      # GitHub reports a job that crosses `timeout-minutes` as **cancelled**, which reads like a
      # person pressed a button. Measured on run 35825866589: the gate-set step went `cancelled`
      # at 24m23s and the job's own post-steps still ran, so a step conditioned on cancelled() has
      # a real chance of being reached — but it is BEST EFFORT and nothing here relies on it. The
      # job that actually converts silence into red is `verdict` below, which runs on its own
      # runner and cannot be killed by this one's clock.
      - name: NO VERDICT — this job was cut off (runs only when the job is cancelled)
        if: cancelled()
        run: |
          echo "::error title=NO VERDICT::agent-suite was CANCELLED. If nobody pressed cancel, this is the job ceiling (${CEILING_MINUTES:-unknown} minutes), and the gate set produced NO VERDICT - not a pass, not a failure. Nothing about this push has been checked."
          exit 1

  # ═══════════════════════════════════════════════════════════════════════════════════════════
  # THE SILENCE, MADE LOUD.  (board #184)
  #
  # `timeout-minutes` does not fail a job, it CANCELS it — and `gh run list` prints `cancelled`,
  # which reads as a scheduling hiccup rather than a missing verdict. That is how board #123 spent
  # weeks quoting a stale gate count: the run that would have corrected it never reached a verdict
  # and nothing said so. Measured on this very workflow, newest last:
  #     af122432 failure 24.1m · f897a720 failure 16.8m · 95909ed8 failure 18.6m
  #     42688485 failure 24.8m · ce678d57 CANCELLED 25.3m · 88923380 failure ~24.5m
  #
  # This job exists to turn "no verdict" into a RED X with a sentence attached. It runs on its own
  # runner, so the clock that killed agent-suite cannot kill it, and `if: always()` means it is
  # reached whatever agent-suite concluded.
  #
  # ⚠ IT FAILS ON ANYTHING THAT IS NOT `success`, INCLUDING A DELIBERATE HUMAN CANCEL — and the
  # message says so rather than pretending to know which happened. A run somebody cancelled on
  # purpose genuinely has no verdict; saying that out loud costs one red X and removes the whole
  # class of "it went quiet and nobody noticed".
  #
  # ⚠ WHAT IS NOT VERIFIED HERE: nobody has watched this fire on a real CI timeout. The wiring is
  # proven locally — tv/test_a_cut_off_gate_set_is_not_a_verdict.py EXECUTES the script below with
  # SUITE_RESULT=cancelled and asserts it exits non-zero — but GitHub's own scheduling of an
  # always() job behind a timed-out `needs` is UNVERIFIED until it happens.
  # ═══════════════════════════════════════════════════════════════════════════════════════════
  verdict:
    name: VERDICT — a cut-off gate set is UNKNOWN, and UNKNOWN is not a pass
    needs: [agent-suite]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # ⚠ MUST EQUAL the agent-suite matrix list — test_a_cut_off_gate_set_is_not_a_verdict pins it.
      GATE_SHARDS: "1 2"
    steps:
      - name: Fetch every shard's gate-set fact
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          pattern: gate-verdict-*
          merge-multiple: true
          path: gate-verdict

      - name: Every shard must have reached its end, and one red shard is a red gate set
        id: shards
        run: |
          # v3472 — ONE shard's silence is the WHOLE set's silence. reached=true only when EVERY
          # expected shard published reached=true; red=true when ANY reached shard was red; red=false
          # only when every shard reached and none was red; anything else is unknown. A missing file
          # is a shard that never got to the end of its gate set — never a green one.
          _dir="${VERDICT_DIR:-gate-verdict}"
          _all=true; _anyred=false; _unknown=false
          for _k in ${GATE_SHARDS}; do
            _f="${_dir}/shard-${_k}.txt"
            if [ ! -f "$_f" ]; then
              echo "shard ${_k}: NO FACT PUBLISHED - it never reached the end of its gate set"
              _all=false; continue
            fi
            _r=$(sed -n 's/^reached=//p' "$_f" | tail -1)
            _d=$(sed -n 's/^red=//p' "$_f" | tail -1)
            echo "shard ${_k}: reached=${_r:-<none>} red=${_d:-<none>}"
            [ "$_r" = "true" ] || _all=false
            [ "$_d" = "true" ] && _anyred=true
            [ "$_d" = "true" ] || [ "$_d" = "false" ] || _unknown=true
          done
          if [ "$_all" = true ]; then
            echo "reached=true" >> "$GITHUB_OUTPUT"
            if [ "$_anyred" = true ]; then echo "red=true" >> "$GITHUB_OUTPUT"
            elif [ "$_unknown" = true ]; then echo "red=unknown" >> "$GITHUB_OUTPUT"
            else echo "red=false" >> "$GITHUB_OUTPUT"; fi
          else
            echo "reached=false" >> "$GITHUB_OUTPUT"
            if [ "$_anyred" = true ]; then echo "red=true" >> "$GITHUB_OUTPUT"; else echo "red=unknown" >> "$GITHUB_OUTPUT"; fi
          fi

      - name: A conclusion that is not a pass must not read like one
        env:
          SUITE_RESULT: ${{ needs.agent-suite.result }}
          GATE_SET_REACHED: ${{ steps.shards.outputs.reached }}
          GATE_SET_RED: ${{ steps.shards.outputs.red }}
        run: |
          echo "agent-suite conclusion: ${SUITE_RESULT:-<none>}"
          echo "gate set reached a verdict: ${GATE_SET_REACHED:-<no>}  (red: ${GATE_SET_RED:-<unknown>})"
          # ⚠⚠ v3447 — A FAILURE THE GATE SET NEVER PRODUCED IS *NOT* A RED GATE SET.
          # `result == failure` only means some step failed. If the gate-set step never reached its
          # end it publishes no `reached`, and saying GATES RED here would name a verdict nobody
          # reached — a FALSE RED, which is worse than the silence this workflow replaced, because
          # a red that is sometimes fiction trains a reader to ignore reds.
          if [ "${SUITE_RESULT:-}" = "failure" ] && [ "${GATE_SET_REACHED:-}" != "true" ]; then
            echo "::error title=NO VERDICT::agent-suite is 'failure' but the GATE SET NEVER REACHED ITS END - it published no verdict, so nothing here says a gate was red. Something before or after it failed (Chromium install, Pillow, checkout, boss portraits, or the intake smoke). Open the job and find the step that failed. NOTHING ABOUT THIS PUSH HAS BEEN CHECKED."
            exit 1
          fi
          case "${SUITE_RESULT:-}" in
            success)
              echo "VERDICT: the gate set ran to the end and every registered gate passed."
              exit 0
              ;;
            failure)
              # ⚠⚠ v3452 — THE OTHER HALF OF v3447, AND IT WAS PUBLISHED AND NEVER READ.
              # v3447 taught the gate-set step to publish `red`, wired it through the job outputs
              # and into this step's env — and then branched only on `reached`, so this arm called
              # a GREEN gate set RED whenever a later step failed. The comment on the gate-set step
              # names that exact path — "(2) the gate set exits 0 and a LATER step (the intake
              # smoke) fails — same false red" — and the code below it did not implement it. A rule
              # stated in prose that the adjacent code does not follow is worse than no comment: it
              # makes the reader believe the case is handled. [[feedback-comments-vs-code]]
              # [[plumbing-with-no-tap]] — found by the cross-family eye on the SHIPPED v3451 bytes.
              case "${GATE_SET_RED:-}" in
                true)
                  echo "::error title=GATES RED::the gate set reached a verdict and it was RED. Open the agent-suite job and read the table - the failing gates are named there."
                  ;;
                false)
                  echo "::error title=NO VERDICT::the GATE SET ITSELF PASSED - every registered gate was green - and a LATER step in agent-suite failed (the intake smoke, or anything after the gate set). NOTHING HERE SAYS A GATE WAS RED. Open the job and find the step that failed."
                  ;;
                *)
                  echo "::error title=NO VERDICT::agent-suite is 'failure' and the gate set published no red/green fact (got '${GATE_SET_RED:-<none>}'), so whether any gate was red is UNKNOWN. UNKNOWN is not a red."
                  ;;
              esac
              exit 1
              ;;
            cancelled|skipped|"")
              echo "::error title=NO VERDICT::agent-suite ended as '${SUITE_RESULT:-<none>}', which is neither a pass nor a failure - the gate set produced NO VERDICT. The usual cause is the job hitting its timeout ceiling, which GitHub reports as 'cancelled'. Nothing about this push has been checked."
              exit 1
              ;;
            *)
              echo "::error title=NO VERDICT::agent-suite ended as '${SUITE_RESULT}', a conclusion this job has never been taught to read. UNKNOWN is not a pass."
              exit 1
              ;;
          esac
