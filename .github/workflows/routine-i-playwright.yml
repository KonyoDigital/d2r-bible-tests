name: Routine I — Playwright suite

# Replaces laptop launchd "Routine I" (daily 09:00 IDT). Runs the full
# tests/ suite against bible.html. Always-on: fires on schedule, on every
# bible.html / tests change (the real ship gate), and on manual dispatch.
#
# v684 re-shard: the suite grew to ~1400 tests — under 3-way sharding a shard
# carried ~470 tests (~29m clean, ~60m with a red streak) and blew the 50m job
# cap, so every run since v681.1 died as a false "cancelled" WITHOUT writing its
# blob report (the failing specs were never named anywhere — 40 undiagnosed
# runs). 6 shards ≈ 234 tests each ≈ 15m clean, well under the ~140-test
# tail-fatigue threshold per worker, with the 50m cap now genuine headroom.
# playwright.config.ts adds a CI globalTimeout (45m) so even a pathological
# shard exits gracefully and REPORTS instead of being SIGKILLed, and CI retries
# drop to 1 so a red shard finishes inside the cap. merge-report now fails
# loudly when any shard's blob is missing instead of quietly merging the rest.
on:
  schedule:
    - cron: '0 6 * * *'   # 09:00 IDT
  workflow_dispatch:
  push:
    paths:
      - 'bible.html'
      - 'tests/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/routine-i-playwright.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# v699.1 (Konyo: 'routines I jumping alot at me') — ship-storm days queued a full 6-shard run per
# push and every superseded run still finished (and emailed). One group: a new push CANCELS the
# in-flight run for the old commit — only the newest commit's verdict survives. The nightly
# scheduled run shares the group, so it also never doubles up with a late-evening push.
concurrency:
  group: routine-i-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: shard ${{ matrix.shard }}/6
    runs-on: ubuntu-latest
    # A healthy shard finishes in ~15m; the config's CI globalTimeout (45m) bounds
    # the run itself, so this cap only catches a wedged runner. Playwright's
    # per-test timeouts still bound any genuine hang.
    #
    # v1706 — 50 WAS TOO TIGHT AND SHARD 2 HAS NEVER ONCE REPORTED BECAUSE OF IT.
    # Measured across three consecutive runs, the last with exact timings:
    #     12:04:22   "64 passed (45.0m)"   <- tests consumed the ENTIRE globalTimeout
    #     12:07:09   "Beginning upload"    <- ~49 min in, against a 50 min cap
    # The blob is multi-GB, so the upload cannot finish in the remaining minute and the
    # runner is cancelled every time. The 5-minute margin between globalTimeout (45) and this
    # cap was sized for a SMALL report; it cannot deliver a large one. That is v684's own
    # lesson — "a global stop reports 'did not run' counts; the runner's SIGKILL reports
    # nothing" — failing at the delivery step instead of the run step.
    # 65 leaves 20 minutes after the global stop, which uploaded 5.39GB comfortably when it
    # was given the room.
    #
    # v1710 — THE CURE, not another bandage. Slow files (every-item sims, 600s
    # audits) live in the `slow` project and a dedicated job below. This matrix
    # only runs --project=chromium, so --shard splits ~375 fast files and a
    # healthy shard stays near 15m. 65m remains the upload headroom.
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Run shard
        run: npx playwright test --project=chromium --shard=${{ matrix.shard }}/6 --reporter=blob
      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: blob-${{ matrix.shard }}
          path: blob-report/
          retention-days: 7

  slow:
    name: slow ${{ matrix.shard }}/2
    runs-on: ubuntu-latest
    # The peeled sims (v645 600s × 2, v333/v566, the 600s audits) used to live
    # inside shard 2 and ate its entire 45m globalTimeout. Two-way shard of
    # ~7 files each, 70m cap so a 600s test + retry still reports.
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Run slow shard
        run: npx playwright test --project=slow --shard=${{ matrix.shard }}/2 --reporter=blob
      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: blob-slow-${{ matrix.shard }}
          path: blob-report/
          retention-days: 7

  merge-report:
    name: merge reports
    if: always()
    needs: [test, slow]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Download shard blobs
        uses: actions/download-artifact@v5
        with:
          path: all-blobs
          pattern: blob-*
          merge-multiple: true
      - name: All shards reported?
        # v684 — a killed shard uploads nothing; merging the survivors used to LOOK complete
        # while hiding exactly the shard that failed. Missing blob = red merge, loudly.
        run: |
          n=$(ls all-blobs/*.zip 2>/dev/null | wc -l)
          echo "shard blobs present: $n / 8 (6 fast + 2 slow)"
          if [ "$n" -lt 8 ]; then
            echo "::error::only $n of 8 shard blob reports present — a shard died without reporting (check its job log)"
            exit 1
          fi
      - name: Merge into HTML report
        run: npx playwright merge-reports --reporter html ./all-blobs
      - name: Upload merged report
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
