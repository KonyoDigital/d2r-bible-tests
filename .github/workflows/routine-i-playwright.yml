name: Routine I — Playwright suite

# Replaces laptop launchd "Routine I" (daily 09:00 IDT). Runs the full
# tests/ suite against bible.html. Always-on: fires on schedule, on every
# bible.html / tests change (the real ship gate), and on manual dispatch.
#
# v684 re-shard: the suite grew to ~1400 tests — under 3-way sharding a shard
# carried ~470 tests (~29m clean, ~60m with a red streak) and blew the 50m job
# cap, so every run since v681.1 died as a false "cancelled" WITHOUT writing its
# blob report (the failing specs were never named anywhere — 40 undiagnosed
# runs). 6 shards ≈ 234 tests each ≈ 15m clean, well under the ~140-test
# tail-fatigue threshold per worker, with the 50m cap now genuine headroom.
# playwright.config.ts adds a CI globalTimeout (45m) so even a pathological
# shard exits gracefully and REPORTS instead of being SIGKILLed, and CI retries
# drop to 1 so a red shard finishes inside the cap. merge-report now fails
# loudly when any shard's blob is missing instead of quietly merging the rest.
on:
  schedule:
    - cron: '0 6 * * *'   # 09:00 IDT
  workflow_dispatch:
  push:
    paths:
      - 'bible.html'
      - 'tests/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: shard ${{ matrix.shard }}/6
    runs-on: ubuntu-latest
    # A healthy shard finishes in ~15m; the config's CI globalTimeout (45m) bounds
    # the run itself, so this cap only catches a wedged runner. Playwright's
    # per-test timeouts still bound any genuine hang.
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Run shard
        run: npx playwright test --shard=${{ matrix.shard }}/6 --reporter=blob
      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: blob-${{ matrix.shard }}
          path: blob-report/
          retention-days: 7

  merge-report:
    name: merge reports
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Download shard blobs
        uses: actions/download-artifact@v5
        with:
          path: all-blobs
          pattern: blob-*
          merge-multiple: true
      - name: All shards reported?
        # v684 — a killed shard uploads nothing; merging the survivors used to LOOK complete
        # while hiding exactly the shard that failed. Missing blob = red merge, loudly.
        run: |
          n=$(ls all-blobs/*.zip 2>/dev/null | wc -l)
          echo "shard blobs present: $n / 6"
          if [ "$n" -lt 6 ]; then
            echo "::error::only $n of 6 shard blob reports present — a shard died without reporting (check its job log)"
            exit 1
          fi
      - name: Merge into HTML report
        run: npx playwright merge-reports --reporter html ./all-blobs
      - name: Upload merged report
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
