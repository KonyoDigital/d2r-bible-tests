name: proof-keys time (throwaway, ci/proof-keys-time only)
# De-risk timing for sharding heart2 --prove: one fat gate and three typical gates on a
# standard runner. Never on main. Nothing here may call the Claude CLI: D2R_NO_CLAUDE=1 and a `claude` on PATH that
# refuses (the tv/no_claude_bin this first named does not exist in the repo).
on:
  push:
    branches: ['ci/proof-keys-time']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prove-time:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    strategy:
      fail-fast: false
      matrix:
        set: [fat, typical]
    env:
      D2R_NO_CLAUDE: "1"
      HEART2_PROVE_WORKERS: "2"
    steps:
      - name: Mark start
        run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 200
      - name: Install Pillow + numpy + websocket-client
        run: python3 -m pip install --quiet pillow numpy websocket-client
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: pw-${{ runner.os }}-
      - name: Install Chromium
        timeout-minutes: 6
        run: npx playwright install chromium
      - name: OS deps for Chromium (best effort)
        timeout-minutes: 5
        continue-on-error: true
        run: npx playwright install-deps chromium
      - name: A claude that refuses
        run: |
          mkdir -p "$RUNNER_TEMP/noclaude"
          printf '#!/bin/sh\necho "claude is not called on CI (proof-keys time)" >&2\nexit 97\n' > "$RUNNER_TEMP/noclaude/claude"
          chmod +x "$RUNNER_TEMP/noclaude/claude"
          echo "$RUNNER_TEMP/noclaude" >> "$GITHUB_PATH"
      - name: Environment
        run: |
          echo "setup_seconds=$(( $(date +%s) - T0 ))"
          nproc; python3 --version; node --version; df -h /tmp | tail -1
      - name: Prove
        timeout-minutes: 150
        run: |
          export HEART2_CACHE_PATH="$RUNNER_TEMP/cache-${{ matrix.set }}.json"
          if [ "${{ matrix.set }}" = fat ]; then
            G="test_the_character_builder_fits_at_every_width"
          else
            G="test_ruling_index_honest test_gate_banks test_a_pulse_that_never_fired_also_leaves_zero"
          fi
          S=$(date +%s)
          set +e
          python3 -u tv/heart2.py --prove $G 2>&1 | while IFS= read -r l; do printf '%s %s\n' "$(( $(date +%s) - S ))" "$l"; done | tee "$RUNNER_TEMP/prove-${{ matrix.set }}.log"
          rc=${PIPESTATUS[0]}
          echo "prove_seconds=$(( $(date +%s) - S )) rc=$rc"
          cp "$HEART2_CACHE_PATH" "$RUNNER_TEMP/" 2>/dev/null || true
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prove-time-${{ matrix.set }}
          path: |
            ${{ runner.temp }}/prove-*.log
            ${{ runner.temp }}/cache-*.json
