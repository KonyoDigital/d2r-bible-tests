name: Routine H — item click sweep

# Replaces laptop launchd "Routine H" (every 12h). Opens every ITEM via
# window.openItemDetail() — catches apostrophe-encoding regressions and any
# item whose detail card fails to render. Gates on fail_count == 0.
on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

  # 2026-08-12 — SWEPT FROM ROUTINE L: this gate audits bible.html and only ever fired on a timer,
  # so a commit that changed the page was not checked until the next day's cron, by which time more
  # ships had landed on top of it. A gate that runs on a clock while the thing it guards changes on
  # pushes is measuring yesterday. Routine L had exactly this and was fixed first; a sweep of the
  # remaining routine-* workflows found four more, of which this is one.
  push:
    paths:
      # v1910 — A GATE MUST SEE THE INPUT IT POLICES, ITSELF INCLUDED. Routine I already says this
      # in its own path list and fixes it for itself; these four did not. Editing H_sweep.js (or this
      # workflow) changed what the gate DOES while triggering nothing, so the change landed and the
      # routine that judges it stayed asleep until the next cron — or, if the edit broke it, until
      # a bible.html push blamed someone else's commit.
      - 'bible.html'
      - 'H_sweep.js'
      - '.github/workflows/routine-h-item-sweep.yml'
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  item-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # 2026-08-19 — A BROKEN UBUNTU MIRROR MUST NOT BE ABLE TO STOP THIS RUN.
      # `playwright install --with-deps` shells out to apt. On this date azure.archive.ubuntu.com
      # answered `Ign` to every index for eight straight minutes; the publish workflow burned its
      # whole 25-minute budget there and surfaced as "cancelled", and routines G and H died the same
      # way on the same push. "Cancelled" reads as "a person stopped this", so the real cause hid.
      # Cache the browser, bound the download, and let the apt top-up fail without taking the job:
      # ubuntu-latest already ships the libraries, and if one is genuinely missing the run below
      # fails on browserType.launch with the library's name in it, which is a far better diagnosis.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: pw-${{ runner.os }}-
      - name: Install Chromium
        timeout-minutes: 6
        run: npx playwright install chromium
      - name: OS deps for Chromium (best effort)
        timeout-minutes: 5
        continue-on-error: true
        run: npx playwright install-deps chromium
      - name: Run item sweep
        run: node H_sweep.js "$GITHUB_WORKSPACE/bible.html" | tee h.log
      # v1910 — GATE ON THREE THINGS, NOT ONE. This step read `fail_count` and nothing else, so it
      # was green in two cases that are not successes:
      #
      #   1. NOTHING WAS TESTED. `items` comes from the page own ITEMS array. If that stops loading
      #      — a rename, a syntax error above it, a data blob that fails to parse — the sweep
      #      reports {tested: 0, opened: 0, fail_count: 0} and this gate said PASS. The codebase
      #      already guards this exact shape elsewhere in as many words: a pass must mean N were
      #      inspected, never that the matcher matched nothing.
      #   2. THE PAGE THREW. H_sweep.js has collected `pageerror` since it was written and the gate
      #      never looked at it — evidence gathered and not consumed, the same defect as a field
      #      nobody reads.
      #
      # Measured on the run before this change: tested 320, opened 320, fail_count 0, errors [].
      # The floor is 250 — comfortably under the real count and comfortably over zero, and it also
      # catches ITEMS shrinking, which is a data regression worth a red run on its own.
      - name: Gate on fails, on nothing tested, and on page errors
        run: |
          node -e '
            const l = require("fs").readFileSync("h.log", "utf8").trim().split("\n").pop();
            const r = JSON.parse(l);
            const errs = r.errors || [];
            console.log("tested " + r.tested + " | opened " + r.opened + " | failed " + r.fail_count + " | page errors " + errs.length);
            let bad = 0;
            if (r.fail_count !== 0) { console.log("::error::Routine H — " + r.fail_count + " item(s) failed to open: " + (r.fails || []).join(", ")); bad = 1; }
            if (!(r.tested >= 250)) { console.log("::error::Routine H tested only " + r.tested + " item(s) — the page ITEMS array did not load, so a green run here would have meant nothing"); bad = 1; }
            if (errs.length) { console.log("::error::Routine H — the page threw during the sweep: " + errs.join(" | ")); bad = 1; }
            process.exit(bad);
          '
