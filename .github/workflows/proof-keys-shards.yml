name: proof-keys shards (ci/proof-keys-* only)
# REG-2588 - ONE heart2 --prove, CUT ACROSS 16 RUNNERS. Each shard proves only its slice of the proof plan
# (tv/proof_shard.py, REG-2585) and banks it into its OWN verdict cache; the fan-in job checks the 16 caches form one
# whole set of this commit (the SAME rules `heart2 --import-shards` applies, REG-2586) and hands them on as ONE
# artifact. Nothing is imported here: the import runs on the machine that pushes, and it refuses a partial set.
# A push to main never starts it on its own; Publish CALLS it (workflow_call, gate: deploy) and its deploy waits for the
# fan-in's verdict (REG-2962). Nothing here may call the Claude CLI: D2R_NO_CLAUDE=1 and a `claude` on PATH that refuses.
# REG-2961 - EACH SHARD STARTS FROM THE PROOFS THE LAST MAIN RUN BANKED: a read-only seed restored by actions/cache
# (HEART2_SHARD_SEED). heart2 serves a seed entry only under the key it takes from THIS checkout's bytes (a sha256 over
# every input's bytes, tv/heart2.py _VerdictCache._key), so a seed of any commit can never serve a proof for other bytes;
# the shard's own file still starts empty and holds only proofs of its own plan. Main runs save the next seed.
# ⚠ N LIVES IN TWO PLACES - PROOF_SHARDS and the matrix list - and
# tv/test_the_shard_workflow_proves_every_proof_once.py goes red if they disagree. 16 <= the Free plan's 20 jobs.
on:
  push:
    branches:
      - 'ci/proof-keys-*'
  workflow_dispatch:
  workflow_call:
    inputs:
      gate:
        description: "deploy - Publish's gate: the shards never fail the run, the fan-in's verdict on this push's laws does"
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: proof-keys-shards-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/ci/') }}
env:
  PROOF_SHARDS: "16"
jobs:
  shard:
    name: shard ${{ matrix.shard }} (${{ matrix.trace }})
    runs-on: ubuntu-latest
    # Planned max ~41 min of proving per shard (21a78ff6, N=16) plus setup; the step cap below fails loud first.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        # REG-3102 WITNESS RUN (diagnostic only, never merged): shard 7 alone, once plain and once with every kill
        # syscall traced, each with a 15 s witness of memory / disk / chrome / heart2 sandboxes into the job log
        shard: [7]
        trace: [none, kills]
    env:
      D2R_NO_CLAUDE: "1"
      HEART2_PROVE_WORKERS: "2"
    steps:
      - name: Mark start
        run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 200
      - name: Fetch the commits test_a_version_stamp_is_not_a_page_change grades
        # RoutineIOnRealHistory.PINNED (debc96a5, f5919534, a8246cdf and its parent) sit deeper than 200 commits, so a
        # shallow shard reads that class UNMEASURED. depth=2 brings each pinned commit and its parent, not the history.
        timeout-minutes: 2
        continue-on-error: true
        run: >-
          git fetch --no-tags --depth=2 origin
          debc96a5420bd6e03c983cc7bbbe90526c213739
          f591953451f7a0aff8db3f22938c6f1ded12ce88
          a8246cdf6340575ba3a50f163d93ce3a0be186a4
      - name: Install Pillow + numpy + websocket-client (as tv-tests)
        run: python3 -m pip install --quiet pillow numpy websocket-client
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: pw-${{ runner.os }}-
      - name: Install Chromium
        timeout-minutes: 6
        run: npx playwright install chromium
      - name: OS deps for Chromium (best effort)
        timeout-minutes: 5
        continue-on-error: true
        run: npx playwright install-deps chromium
      - name: Restore the proofs the last main run banked (REG-2961)
        # a miss is a cold run, never a failure: every proof of this shard then runs, as before the seed
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/heart2-seed
          key: heart2-proofs-${{ github.sha }}
          restore-keys: heart2-proofs-
      - name: A claude that refuses
        run: |
          mkdir -p "$RUNNER_TEMP/noclaude"
          printf '#!/bin/sh\necho "claude is not called on CI (proof-keys shards)" >&2\nexit 97\n' > "$RUNNER_TEMP/noclaude/claude"
          chmod +x "$RUNNER_TEMP/noclaude/claude"
          echo "$RUNNER_TEMP/noclaude" >> "$GITHUB_PATH"
      - name: Prove this shard
        timeout-minutes: 160
        run: |
          echo "setup_seconds=$(( $(date +%s) - T0 ))"
          D="$RUNNER_TEMP/shard-${{ matrix.shard }}"
          mkdir -p "$D"
          export HEART2_CACHE_PATH="$D/.heart2_cache.json"
          export HEART2_SHARD_SEED="$RUNNER_TEMP/heart2-seed/.heart2_cache.json"
          if [ -f "$HEART2_SHARD_SEED" ]; then echo "REG-2961: seeded from the last main run's proofs"; else
            unset HEART2_SHARD_SEED; echo "REG-2961: no seed restored - every proof of this shard runs"; fi
          S=$(date +%s)
          set +e
          W="$D/witness.log"
          echo "WITNESS-START $(date -u +%T) nproc=$(nproc) $(free -m | awk '/Mem:/{printf "mem_total=%sM", $2} /Swap:/{printf " swap_total=%sM", $2}') ulimit_u=$(ulimit -u) ulimit_n=$(ulimit -n)" | tee -a "$W"
          ps -eo pid,pgid,sid,ppid,comm | awk 'NR==1 || /Runner|bash|python|node/' | sed 's/^/WITNESS-PGRP /' | tee -a "$W"
          (
            i=0; K=0
            while true; do
              ts=$(date -u +%T)
              mem=$(free -m | awk '/Mem:/{printf "mem_used=%sM avail=%sM", $3, $7} /Swap:/{printf " swap_used=%sM", $3}')
              disk=$(df -m / | awk 'NR==2{printf "root_free=%sM", $4}')
              tmpm=$(du -sm /tmp 2>/dev/null | cut -f1)
              nch=$(pgrep -c -f 'chrom|headless_shell' || true)
              rss=$(ps -eo rss=,args= | awk '/chrom|headless_shell/ && !/awk/ {s+=$1} END {printf "%d", s/1024}')
              sbx=$(ls -d /tmp/heart2.* 2>/dev/null | wc -l)
              sbxm=$(du -smc /tmp/heart2.* 2>/dev/null | tail -1 | cut -f1)
              np=$(ps -e --no-headers | wc -l)
              load=$(cut -d' ' -f1 /proc/loadavg)
              oom=$(sudo -n dmesg 2>/dev/null | grep -ciE 'oom|killed process' || true)
              echo "WITNESS $ts $mem $disk tmp=${tmpm}M chrome=$nch chrome_rss=${rss}M heart2_sbx=$sbx(${sbxm:-0}M) procs=$np load=$load dmesg_oom=$oom" | tee -a "$W"
              if [ $((i % 4)) -eq 0 ]; then ps -eo rss,pid,pgid,etime,comm --sort=-rss | head -6 | sed "s/^/WITNESS-TOP $ts /" | tee -a "$W"; fi
              if [ -f "$D/kills.log" ]; then
                n=$(wc -l < "$D/kills.log")
                if [ "$n" -gt "$K" ]; then
                  tail -n +$((K + 1)) "$D/kills.log" | grep -vE 'resumed|SIGCHLD|SIGURG|SIGPIPE' | grep -E 'kill\(' | sed 's/^/KILLCALL /' | head -40 | tee -a "$W"
                  K=$n
                fi
              fi
              i=$((i + 1))
              sleep 15
            done
          ) &
          WITNESS_PID=$!
          trap 'echo "STEP-TERM $(date -u +%T)"; ps -eo pid,pgid,sid,ppid,rss,etime,args --sort=pgid | cut -c1-180 | head -150 | sed "s/^/STEP-TERM /"' TERM
          ST=""
          if [ "${{ matrix.trace }}" = "kills" ]; then
            if command -v strace >/dev/null 2>&1; then
              ST="strace -f --seccomp-bpf -e trace=kill,tkill,tgkill,pidfd_send_signal -e signal=none -o $D/kills.log"
            else
              echo "WITNESS strace is not on this runner - the kills variant runs untraced"
            fi
          fi
          $ST python3 -u tv/heart2.py --prove --push --proof-shard "${{ matrix.shard }}/${PROOF_SHARDS}" 2>&1 | tee "$D/prove.log"
          rc=${PIPESTATUS[0]}
          echo "prove_seconds=$(( $(date +%s) - S )) rc=$rc" | tee -a "$D/prove.log"
          if [ "${{ inputs.gate }}" = "deploy" ]; then
            # REG-2962 - Publish's gate: a failure is named in this shard's manifest (owed), and the fan-in's verdict holds
            # the deploy when it is one of THIS push's laws. A shard that never finishes leaves no manifest: refused there.
            echo "deploy gate: rc=$rc is the fan-in verdict's to judge"
            exit 0
          fi
          exit $rc
      - name: What the kernel and the disk say at the end (REG-3102 witness)
        if: always()
        run: |
          echo "--- dmesg oom / killed ---"; sudo -n dmesg -T 2>/dev/null | grep -iE 'oom|killed process|out of memory' | tail -40 || echo "dmesg unreadable"
          echo "--- free ---"; free -m; echo "--- df ---"; df -h / /tmp; echo "--- chrome ---"; pgrep -af 'chrom|headless_shell' | cut -c1-160 | head -20
          echo "--- heart2 sandboxes ---"; ls -d /tmp/heart2.* 2>/dev/null | head; du -smc /tmp/heart2.* 2>/dev/null | tail -1
          echo "--- last kill calls ---"; tail -60 "$RUNNER_TEMP/shard-${{ matrix.shard }}/kills.log" 2>/dev/null | grep -E 'kill\(' | tail -40 || true
      - name: Upload this shard's cache
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proof-shard-${{ matrix.shard }}-${{ matrix.trace }}
          path: ${{ runner.temp }}/shard-${{ matrix.shard }}/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  fan-in:
    name: fan-in - one whole set of this commit, or none
    needs: [shard]
    if: ${{ false }}   # REG-3102 witness run: one shard is no set
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Fetch every shard's cache
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          pattern: proof-shard-*
          path: shards
      - name: The census - what this commit proved, and the laws the next batch fixes (REG-2595)
        if: ${{ always() }}
        run: |
          python3 tv/proof_shard.py --census shards --shards "$PROOF_SHARDS" --head "$GITHUB_SHA" --out census.md
          cat census.md >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the census
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: proof-census-${{ github.sha }}
          path: census.md
          if-no-files-found: warn
          retention-days: 30
      - name: Bank this run's proofs as the next run's seed (REG-2961, main only)
        # main's cache scope is the one every branch may restore; a ci/ branch's cache would serve that branch alone
        if: ${{ always() && github.ref == 'refs/heads/main' }}
        run: python3 tv/proof_shard.py --merge-shards shards --out "$RUNNER_TEMP/heart2-seed/.heart2_cache.json"
      - name: Save the seed (REG-2961, main only)
        if: ${{ always() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/heart2-seed
          key: heart2-proofs-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Every shard finished, on this commit, on one plan
        run: python3 tv/proof_shard.py --fan-in shards --shards "$PROOF_SHARDS" --head "$GITHUB_SHA"
      - name: Hand the whole set on as one artifact
        uses: actions/upload-artifact@v4
        with:
          name: proof-shards-${{ github.sha }}
          path: shards/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: May this commit publish? (REG-2962, Publish's gate only)
        # every law the push changed since the last commit Publish published must be PROVEN here (or be one only the
        # Mac can prove, which the hook proved); no last publish or no diff -> every law is this push's
        if: ${{ inputs.gate == 'deploy' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow publish.yml --branch main --status success \
                   --limit 1 --json headSha --jq '.[0].headSha' 2>/dev/null || true)"
          if [ -n "$BASE" ] && ! git fetch --no-tags --depth=1 origin "$BASE" 2>/dev/null; then
            echo "the last published commit ${BASE:0:12} could not be fetched - every law is this push's"; BASE=""
          fi
          echo "last published commit: ${BASE:-UNKNOWN}"
          python3 tv/proof_shard.py --deploy-verdict shards --shards "$PROOF_SHARDS" --head "$GITHUB_SHA" --base "$BASE"
