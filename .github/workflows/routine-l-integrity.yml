name: Routine L — data integrity drift

# Replaces laptop launchd "Routine L" (daily 10:30 IDT). Probes ITEMS.length,
# BOSSES.length and key drop-chance values, diffs against the committed
# baseline/integrity_baseline.json. Fails on any drift — an intentional data
# change means: re-run, eyeball the diff, then update the baseline file.
on:
  schedule:
    - cron: '30 7 * * *'   # 10:30 IDT
  workflow_dispatch:
  # 2026-08-12 — THIS GATE COULD NOT SEE THE PUSH IT EXISTS TO CHECK.
  # It probes ITEMS.length / BOSSES.length out of bible.html and fails on drift from
  # baseline/integrity_baseline.json — but it only ever fired on a timer, so a commit that changed
  # ITEMS or BOSSES sailed through and the drift was not reported until the next morning's cron,
  # by which point several more ships had landed on top of it. A gate that runs on a clock while
  # the thing it guards changes on pushes is measuring yesterday.
  # Found by a third-eye sweep (a different model family), which also caught GAME_RULES.md still
  # documenting this gate as "312 items, 11 bosses" while the baseline it reads says 322 and 13.
  push:
    paths:
      - 'bible.html'
      - 'baseline/integrity_baseline.json'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # 2026-08-19 — A BROKEN UBUNTU MIRROR MUST NOT BE ABLE TO STOP THIS RUN.
      # `playwright install --with-deps` shells out to apt. On this date azure.archive.ubuntu.com
      # answered `Ign` to every index for eight straight minutes; the publish workflow burned its
      # whole 25-minute budget there and surfaced as "cancelled", and routines G and H died the same
      # way on the same push. "Cancelled" reads as "a person stopped this", so the real cause hid.
      # Cache the browser, bound the download, and let the apt top-up fail without taking the job:
      # ubuntu-latest already ships the libraries, and if one is genuinely missing the run below
      # fails on browserType.launch with the library's name in it, which is a far better diagnosis.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: pw-${{ runner.os }}-
      - name: Install Chromium
        timeout-minutes: 6
        run: npx playwright install chromium
      - name: OS deps for Chromium (best effort)
        timeout-minutes: 5
        continue-on-error: true
        run: npx playwright install-deps chromium
      - name: Run integrity probe
        run: node L_integrity.js "$GITHUB_WORKSPACE/bible.html"
      - name: Diff against baseline
        run: |
          node -e '
            const fs = require("fs");
            const norm = o => JSON.stringify(o, (k, v) =>
              v && typeof v === "object" && !Array.isArray(v)
                ? Object.keys(v).sort().reduce((a, kk) => (a[kk] = v[kk], a), {})
                : v);
            const base = JSON.parse(fs.readFileSync("baseline/integrity_baseline.json", "utf8"));
            const cur = JSON.parse(fs.readFileSync("/tmp/L_result.json", "utf8"));
            if (norm(base) !== norm(cur)) {
              console.log("::error::Routine L — data integrity drift detected");
              console.log("baseline: " + norm(base));
              console.log("current : " + norm(cur));
              process.exit(1);
            }
            console.log("Integrity baseline matched — no drift");
          '
