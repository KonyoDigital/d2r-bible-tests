name: Routine J — visual screenshots

# Replaces laptop launchd "Routine J" (daily 10:00 IDT). Captures 4 reference
# screenshots (bosses, Travincal card, calc+Shako, TZ tab) and uploads them as
# a build artifact for manual visual review. (Pixel-diff against a committed
# baseline can be layered on later.)
on:
  schedule:
    - cron: '0 7 * * *'   # 10:00 IDT
  workflow_dispatch:

  # 2026-08-12 — SWEPT FROM ROUTINE L: this gate audits bible.html and only ever fired on a timer,
  # so a commit that changed the page was not checked until the next day's cron, by which time more
  # ships had landed on top of it. A gate that runs on a clock while the thing it guards changes on
  # pushes is measuring yesterday. Routine L had exactly this and was fixed first; a sweep of the
  # remaining routine-* workflows found four more, of which this is one.
  push:
    paths:
      - 'bible.html'
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # 2026-08-19 — A BROKEN UBUNTU MIRROR MUST NOT BE ABLE TO STOP THIS RUN.
      # `playwright install --with-deps` shells out to apt. On this date azure.archive.ubuntu.com
      # answered `Ign` to every index for eight straight minutes; the publish workflow burned its
      # whole 25-minute budget there and surfaced as "cancelled", and routines G and H died the same
      # way on the same push. "Cancelled" reads as "a person stopped this", so the real cause hid.
      # Cache the browser, bound the download, and let the apt top-up fail without taking the job:
      # ubuntu-latest already ships the libraries, and if one is genuinely missing the run below
      # fails on browserType.launch with the library's name in it, which is a far better diagnosis.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: pw-${{ runner.os }}-
      - name: Install Chromium
        timeout-minutes: 6
        run: npx playwright install chromium
      - name: OS deps for Chromium (best effort)
        timeout-minutes: 5
        continue-on-error: true
        run: npx playwright install-deps chromium
      - name: Capture screenshots
        run: |
          mkdir -p shots
          node J_screens.js shots "$GITHUB_WORKSPACE/bible.html"
      - name: Upload screenshots
        uses: actions/upload-artifact@v5
        with:
          name: routine-j-screenshots
          path: shots/
          retention-days: 30
