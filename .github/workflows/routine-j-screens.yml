name: Routine J — visual screenshots

# Replaces laptop launchd "Routine J" (daily 10:00 IDT). Captures 4 reference
# screenshots (bosses, Travincal card, calc+Shako, TZ tab) and uploads them as
# a build artifact.
#
# v1910 — AND IT JUDGES THEM NOW. Until then this job printed "captured 4 screenshots" and exited 0
# ALWAYS: the shots were uploaded "for manual visual review", and nobody downloads a 30-day artifact
# daily. So it reported SUCCESS for a page that could be four black rectangles, four copies of one
# unchanged view, or a calc panel with nothing selected. A green lamp with no judgement.
#
# It asserts three renderer-independent things instead of the pixel baseline this header used to
# propose (a committed baseline goes flaky the moment CI's fonts or GPU flags move, and a gate that
# cries wolf gets disabled): every shot PAINTED something, the four states are actually DIFFERENT
# from each other, and the state each shot claims to show is the state the page was in. Thresholds
# were measured on the real page first — see the header of J_screens.js.
on:
  schedule:
    - cron: '0 7 * * *'   # 10:00 IDT
  workflow_dispatch:

  # 2026-08-12 — SWEPT FROM ROUTINE L: this gate audits bible.html and only ever fired on a timer,
  # so a commit that changed the page was not checked until the next day's cron, by which time more
  # ships had landed on top of it. A gate that runs on a clock while the thing it guards changes on
  # pushes is measuring yesterday. Routine L had exactly this and was fixed first; a sweep of the
  # remaining routine-* workflows found four more, of which this is one.
  push:
    paths:
      # v1910 — A GATE MUST SEE THE INPUT IT POLICES, ITSELF INCLUDED. Routine I already says this
      # in its own path list and fixes it for itself; these four did not. Editing J_screens.js (or this
      # workflow) changed what the gate DOES while triggering nothing, so the change landed and the
      # routine that judges it stayed asleep until the next cron — or, if the edit broke it, until
      # a bible.html push blamed someone else's commit.
      - 'bible.html'
      - 'J_screens.js'
      - '.github/workflows/routine-j-screens.yml'
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # 2026-08-19 — A BROKEN UBUNTU MIRROR MUST NOT BE ABLE TO STOP THIS RUN.
      # `playwright install --with-deps` shells out to apt. On this date azure.archive.ubuntu.com
      # answered `Ign` to every index for eight straight minutes; the publish workflow burned its
      # whole 25-minute budget there and surfaced as "cancelled", and routines G and H died the same
      # way on the same push. "Cancelled" reads as "a person stopped this", so the real cause hid.
      # Cache the browser, bound the download, and let the apt top-up fail without taking the job:
      # ubuntu-latest already ships the libraries, and if one is genuinely missing the run below
      # fails on browserType.launch with the library's name in it, which is a far better diagnosis.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: pw-${{ runner.os }}-
      - name: Install Chromium
        timeout-minutes: 6
        run: npx playwright install chromium
      - name: OS deps for Chromium (best effort)
        timeout-minutes: 5
        continue-on-error: true
        run: npx playwright install-deps chromium
      - name: Capture screenshots
        run: |
          mkdir -p shots
          node J_screens.js shots "$GITHUB_WORKSPACE/bible.html"
      - name: Upload screenshots
        uses: actions/upload-artifact@v5
        with:
          name: routine-j-screenshots
          path: shots/
          retention-days: 30
